[package]
name = "textpen"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
description = "A code editor in the terminal pane: a file tree, tabs, search and the terminal's own colours, over plain ssh"
repository = "https://github.com/bateri/textpen"

[[bin]]
name = "textpen"
path = "src/program/main.rs"

[dependencies]
# The program's side of pencere, at the commit whose kit has the editor and the library of @pencere modules (crates.io's 0.3 has kit 1.0).
# Every pencere crate here is at the same commit, written whole: Cargo.lock is where it is pinned.
pencere = { git = "https://github.com/bateri/pencere", rev = "6ad519e36011d94873d441861678c15fa495a081" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The project search: patterns a person types, searched in time linear in the text (no
# back-references, no look-around).
regex = "1"
# The name of a draft and of a project's state is the start of the SHA-256 of its path, as the
# textpen before this one named them, so that what it left is found.
sha2 = "0.10"
# The icons a terminal draws beside the program's name travel as `data:` URIs.
base64 = "0.22"
# The lines that differ between the buffer and the file in git's index (the marks of the gutter): a
# line diff with a time limit, and nothing else of it.
similar = "2"
# What the standard library does not say: the machine's name, the user's, whether a file can be
# written to.
libc = "0.2"

[build-dependencies]
pencere = { git = "https://github.com/bateri/pencere", rev = "6ad519e36011d94873d441861678c15fa495a081" }

[dev-dependencies]
# Each test has a directory of its own as its home and its project.
tempfile = "3"
# The page (src/view/) run as a terminal runs it, with no screen: the kit's interpreter and editors,
# a clock the test moves, and the program's own handlers in this process (`program`); and pictures
# of it for the eye, in the fonts of the machine (`shot`, `make shots`).
pencere-drive = { git = "https://github.com/bateri/pencere", rev = "6ad519e36011d94873d441861678c15fa495a081", features = ["program", "shot"] }
# The names of the page's elements (`Id`), to tell which of its editors is shown.
pencere-view = { git = "https://github.com/bateri/pencere", rev = "6ad519e36011d94873d441861678c15fa495a081" }
# The files of a page's bundle (`Assets`): a test's own script beside the page; and what a page's
# calls are held to (`ModuleLimits`).
pencere-sandbox = { git = "https://github.com/bateri/pencere", rev = "6ad519e36011d94873d441861678c15fa495a081" }

# The page tests compile the kit's interpreter to machine code, with wasmtime's code generator, as
# each page opens; built without optimization (a debug build) that takes some 13 seconds a page,
# optimized about one. The generator and what feeds it are optimized in the development profile
# too, as pencere's own workspace does: compiled once, cached with the rest.
[profile.dev.package.cranelift-codegen]
opt-level = 2
[profile.dev.package.cranelift-frontend]
opt-level = 2
[profile.dev.package.cranelift-entity]
opt-level = 2
[profile.dev.package.cranelift-bforest]
opt-level = 2
[profile.dev.package.regalloc2]
opt-level = 2
[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 2
[profile.dev.package.wasmtime-environ]
opt-level = 2
[profile.dev.package.wasmparser]
opt-level = 2

# The line diff of the marks of the gutter runs as the person types, in tests as in the release.
[profile.dev.package.similar]
opt-level = 2

[lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
