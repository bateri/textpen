# The gate on every push to main and every pull request: `make check` (rustfmt and clippy, and the
# program's tests: its own, and the ones that run it in a pane under pencere's stand-in terminal), on
# Linux and macOS. The page's tests join it when they are written (plan Phase 5).
#
# pencere, which textpen is built and tested with, is the one Cargo.lock takes: the program is built
# on that crate, and the stand-in terminal the tests run it in is built from the same commit
# (`make fake-host`, into .cache/pencere). Nothing else says which pencere. Moving it is a change of
# Cargo.toml and Cargo.lock, and of nothing here.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The toolchain the crate's rust-version names, so a new lint of a later release does not turn
      # the gate red on code nobody touched.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.88.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: gate
          workspaces: |
            . -> target
            .cache/pencere -> target
      - name: The stand-in terminal, of the pencere Cargo.lock takes
        run: make fake-host
      - run: make check FAKE_HOST=.cache/pencere/target/debug/pencere-fake-host
      - name: Say what the gate was held to
        run: |
          {
            echo "### What this run was held to"
            echo
            echo "pencere at \`$(make -s pencere-ref)\` (\`Cargo.lock\`): the crate the program is built on, and the stand-in terminal its tests ran it in."
            echo
            echo "Not held to: the kit's 250 ms a call of the page, which the page's tests only keep to on a machine at rest (\`make check-timing\`); they ran with 10 s."
          } >> "$GITHUB_STEP_SUMMARY"
